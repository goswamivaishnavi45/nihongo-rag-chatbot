<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japanese RAG Chatbot</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --user: #2f5bea; --user-text: #ffffff; --border: #e3e3e0; --accent: #c8102e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --panel: #1e1e21; --text: #ececee; --muted: #9a9aa0;
      --user: #3d66f0; --user-text: #ffffff; --border: #2e2e33; --accent: #ff4d63;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header { padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { margin: 0; font-size: 1.05rem; }
  header h1 span { color: var(--accent); }
  header p { margin: 2px 0 0; font-size: 0.82rem; color: var(--muted); }
  #chat { flex: 1; overflow-y: auto; padding: 16px; max-width: 820px; width: 100%; margin: 0 auto; }
  .msg { margin: 10px 0; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.6;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .user .bubble { background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .bot .bubble { background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .bot.error .bubble { border-color: var(--accent); }
  details { margin-top: 8px; font-size: 0.82rem; color: var(--muted); }
  details summary { cursor: pointer; }
  .source { margin: 6px 0 0; padding: 6px 8px; border-left: 3px solid var(--border); white-space: normal; }
  .source b { color: var(--text); }
  #examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  #topics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #topics button { font-size: 0.78rem; padding: 4px 10px; }
  #examples button, #topics button {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 0.85rem; cursor: pointer;
  }
  form {
    display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border);
    background: var(--panel); max-width: 820px; width: 100%; margin: 0 auto;
  }
  input {
    flex: 1; min-width: 0; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  }
  form button {
    padding: 10px 16px; font: inherit; border: 0; border-radius: 10px;
    background: var(--user); color: var(--user-text); cursor: pointer;
  }
  form button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Japanese RAG Chatbot <span>日本語</span></h1>
  <p>Answers only from the indexed Japanese documents, with sources. Ask in Japanese or English.</p>
</header>

<main id="chat">
  <div class="msg bot"><div class="bubble">こんにちは! Ask me a question about the documents.
    <div id="examples">
      <button>在留カードをなくしたらどうすればいいですか？</button>
      <button>What number do I call for an ambulance?</button>
      <button>転職しました。入管に届け出る必要がありますか？</button>
      <button>Who was Gustav Mahler?</button>
      <button>What do you know?</button>
      <button>How much does a work visa renewal cost?</button>
    </div>
    <details id="topics-box">
      <summary>What I know about</summary>
      <div id="topics"></div>
    </details>
  </div></div>
</main>

<form id="form">
  <input id="question" placeholder="Type a question / 質問を入力…" autocomplete="off" maxlength="500">
  <button id="send">Send</button>
</form>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("question");
  const send = document.getElementById("send");

  // textContent (never innerHTML) for anything from the user or the model, so text can't inject HTML.
  function addMessage(role, text, extraClass = "") {
    const msg = document.createElement("div");
    msg.className = `msg ${role} ${extraClass}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    msg.appendChild(bubble);
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  function addSources(bubble, sources) {
    const details = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = `Sources (${sources.length})`;
    details.appendChild(summary);
    for (const s of sources) {
      const div = document.createElement("div");
      div.className = "source";
      const label = document.createElement("b");
      label.textContent = `[${s.number}] ${s.source}`;
      div.appendChild(label);
      div.appendChild(document.createElement("br"));
      div.appendChild(document.createTextNode(s.text));
      details.appendChild(div);
    }
    bubble.appendChild(details);
  }

  async function ask(question) {
    addMessage("user", question);
    const bubble = addMessage("bot", "Thinking…");
    send.disabled = true;
    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || res.statusText);
      bubble.textContent = data.answer;
      addSources(bubble, data.sources);
    } catch (err) {
      bubble.textContent = `Error: ${err.message}`;
      bubble.parentElement.classList.add("error");
    } finally {
      send.disabled = false;
      input.focus();
      chat.scrollTop = chat.scrollHeight;
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    input.value = "";
    ask(q);
  });

  document.querySelectorAll("#examples button").forEach((b) =>
    b.addEventListener("click", () => ask(b.textContent))
  );

  // Topic list: clicking a topic asks about it.
  fetch("/api/topics").then((r) => r.json()).then((topics) => {
    document.querySelector("#topics-box summary").textContent = `What I know about (${topics.length} topics)`;
    const box = document.getElementById("topics");
    for (const t of topics) {
      const b = document.createElement("button");
      b.textContent = t;
      b.addEventListener("click", () => ask(`Tell me about ${t}`));
      box.appendChild(b);
    }
  });
</script>
</body>
</html>
